services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8788"
      DB_PATH: /data/forex-bot.db
    ports:
      - "8788:8788"
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8788/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "3000"
      DB_PATH: /data/forex-bot.db
      NEXT_PUBLIC_BOT_API_URL: http://bot:8788
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/data
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
